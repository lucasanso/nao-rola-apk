name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes e lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Testes (engine e app) e lint
        run: ./gradlew :engine:test :app:testDebugUnitTest :app:lintDebug --console=plain

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            engine/build/reports/tests
            app/build/reports
          retention-days: 7
